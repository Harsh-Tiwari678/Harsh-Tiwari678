name: Refresh profile visuals

on:
  schedule:
    # Runs daily at 00:17 UTC (05:47 India time).
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render profile SVG cards
        run: python scripts/render_profile_cards.py --output dist/cards

      - name: Publish generated SVGs to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
