<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-label="Monthly GitHub contributions and activity statistics"><title>Monthly GitHub contributions and activity statistics</title>
<style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .ink { fill: #20242b; } .muted { fill: #69717d; } .blue { fill: #2864dc; }
      .card { fill: #f7f6f2; stroke: #e3e1da; stroke-width: 1; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes shine { 0%, 65% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
      .enter { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
      .shine { animation: shine 5s ease-in-out infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { *, .enter, .shine, .pulse { animation: none !important; } }
    </style>
<rect x="1" y="1" width="1098" height="388" rx="18" class="card"/>
<text x="38" y="49" font-size="13" letter-spacing="2" class="muted">GITHUB / LAST 12 MONTHS</text>
<text x="38" y="88" font-size="11" letter-spacing="1.1" class="muted">CONTRIBUTIONS</text>
<text x="38" y="126" font-size="27" class="serif ink">350</text>
<text x="300" y="88" font-size="11" letter-spacing="1.1" class="muted">ACTIVE DAYS</text>
<text x="300" y="126" font-size="27" class="serif ink">126</text>
<text x="545" y="88" font-size="11" letter-spacing="1.1" class="muted">CURRENT STREAK</text>
<text x="545" y="126" font-size="27" class="serif ink">1 days</text>
<text x="810" y="88" font-size="11" letter-spacing="1.1" class="muted">LONGEST STREAK</text>
<text x="810" y="126" font-size="27" class="serif ink">19 days</text>
<text x="38" y="159" font-size="12" class="muted">Busiest weekday: <tspan fill="#2864dc" font-weight="600">Sunday</tspan></text>
