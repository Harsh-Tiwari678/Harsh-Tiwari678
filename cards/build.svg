<svg xmlns="http://www.w3.org/2000/svg" width="350" height="112" viewBox="0 0 350 112" role="img" aria-labelledby="title desc">
<title id="title">BUILD</title>
<desc id="desc">Dark GitHub profile card with subtle accent styling.</desc>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.58}50%{opacity:1}}
.enter{animation:rise .55s ease-out both}.accent{animation:pulse 4.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*,.enter,.accent{animation:none!important}}
</style>
<rect x=".5" y=".5" width="349" height="111" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="348" height="110" rx="15" fill="#161b22"/>
<rect x="20" y="22" width="3" height="68" rx="2" fill="#58a6ff"/>
<text x="38" y="49" fill="#58a6ff" font-size="12" font-weight="700" letter-spacing="2" class="enter" style="animation-delay:0s">BUILD</text>
<text x="38" y="73" fill="#e6edf3" font-size="13" class="enter" style="animation-delay:0s">Backend systems and product engineering</text>
<circle cx="322" cy="28" r="3" fill="#58a6ff" class="accent"/>
</svg>
