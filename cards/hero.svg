<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270" role="img" aria-label="Harsh Tiwari profile introduction"><title>Harsh Tiwari profile introduction</title>
<style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .ink { fill: #20242b; } .muted { fill: #69717d; } .blue { fill: #2864dc; }
      .card { fill: #f7f6f2; stroke: #e3e1da; stroke-width: 1; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes shine { 0%, 65% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
      .enter { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
      .shine { animation: shine 5s ease-in-out infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { *, .enter, .shine, .pulse { animation: none !important; } }
    </style>
<rect x="1" y="1" width="1098" height="268" rx="18" class="card"/>
<text x="54" y="58" font-size="13" letter-spacing="3" class="muted">ENGINEERING / BUILDING / LEARNING</text>
<text x="50" y="142" font-size="68" class="serif ink enter">Harsh Tiwari</text>
<text x="54" y="184" font-size="20" class="ink enter" style="animation-delay:.12s">I build systems that solve real problems.</text>
<text x="54" y="224" font-size="14" class="muted">Backend  ·  DevOps  ·  Applied AI  ·  Security</text>
<rect x="850" y="48" width="190" height="170" rx="14" fill="#eef1f7" stroke="#d9deea"/>
<text x="945" y="143" text-anchor="middle" font-size="64" class="serif blue">HT</text>
<circle cx="1022" cy="62" r="5" fill="#2864dc" class="pulse"/>
<text x="850" y="244" font-size="12" class="muted">@Harsh-Tiwari678</text>
</svg>