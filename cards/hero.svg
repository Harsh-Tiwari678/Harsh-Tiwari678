<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc">
<title id="title">Harsh Tiwari — profile</title>
<desc id="desc">Dark GitHub profile card with subtle accent styling.</desc>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.58}50%{opacity:1}}
.enter{animation:rise .55s ease-out both}.accent{animation:pulse 4.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*,.enter,.accent{animation:none!important}}
</style>
<rect x=".5" y=".5" width="1099" height="229" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="1098" height="228" rx="16" fill="#161b22"/>
<rect x="32" y="34" width="3" height="160" rx="2" fill="#58a6ff"/>
<text x="58" y="82" fill="#e6edf3" font-size="42" font-weight="650" class="enter">Harsh Tiwari</text>
<text x="60" y="119" fill="#8b949e" font-size="17" class="enter" style="animation-delay:.08s">I build practical software across infrastructure and security.</text>
<text x="60" y="165" fill="#e6edf3" font-size="12" font-weight="650" letter-spacing="2">AREAS OF INTEREST</text>
<text x="60" y="190" fill="#8b949e" font-size="15">Backend systems  ·  DevOps  ·  Applied AI  ·  Application security</text>
<circle cx="1032" cy="50" r="4" fill="#58a6ff" class="accent"/>
</svg>
