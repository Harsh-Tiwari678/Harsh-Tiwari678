<svg xmlns="http://www.w3.org/2000/svg" width="520" height="156" viewBox="0 0 520 156" role="img" aria-labelledby="title desc">
<title id="title">Secure Evidence</title>
<desc id="desc">Dark GitHub profile card with subtle accent styling.</desc>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.58}50%{opacity:1}}
.enter{animation:rise .55s ease-out both}.accent{animation:pulse 4.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*,.enter,.accent{animation:none!important}}
</style>
<rect x=".5" y=".5" width="519" height="155" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="518" height="154" rx="15" fill="#161b22"/>
<text x="24" y="32" fill="#58a6ff" font-size="11" font-weight="650" letter-spacing="1.7" class="enter" style="animation-delay:0s">FEATURED PROJECT  /  01</text>
<text x="24" y="74" fill="#e6edf3" font-size="25" font-weight="620" class="enter" style="animation-delay:0s">Secure Evidence</text>
<text x="24" y="105" fill="#8b949e" font-size="13" class="enter" style="animation-delay:0s">Evidence management with integrity, access control and auditability.</text>
<text x="24" y="132" fill="#58a6ff" font-size="12">VIEW PROJECT  ↗</text>
</svg>
