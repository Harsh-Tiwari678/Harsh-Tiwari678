<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="126" viewBox="0 0 1100 126" role="img" aria-labelledby="title desc">
<title id="title">Selected achievements</title>
<desc id="desc">Dark GitHub profile card with subtle accent styling.</desc>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.58}50%{opacity:1}}
.enter{animation:rise .55s ease-out both}.accent{animation:pulse 4.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*,.enter,.accent{animation:none!important}}
</style>
<rect x=".5" y=".5" width="1099" height="125" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="1098" height="124" rx="15" fill="#161b22"/>
<text x="26" y="36" fill="#e3b341" font-size="11" font-weight="650" letter-spacing="1.7">HIGHLIGHTS</text>
<text x="26" y="75" fill="#e6edf3" font-size="17" font-weight="600">Smart India Hackathon 2024</text>
<text x="26" y="99" fill="#8b949e" font-size="13">Winner</text>
<line x1="540" y1="25" x2="540" y2="101" stroke="#30363d"/>
<text x="570" y="75" fill="#e6edf3" font-size="17" font-weight="600">Research published in IJACEN</text>
<text x="570" y="99" fill="#8b949e" font-size="13">August 2025</text>
</svg>
